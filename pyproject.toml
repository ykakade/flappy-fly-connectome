[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "flappy-fly-connectome"
version = "0.1.0"
description = "MaleCNS-connectome-derived controller for a seeded flight game"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0", "torch>=2.5", "pyarrow>=18", "pandas>=2.2"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
